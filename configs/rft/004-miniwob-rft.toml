schema_version = 1

[run]
job_id = "miniwob-qwen3vl8b-rft-v6"

[fireworks]
account_id = "prateekpravanjan"

[evaluator]
id = "test-miniwob-test-miniwob"
entry = "evaluator/miniwob/test_miniwob.py::test_miniwob"

[dataset]
path = "evaluator/miniwob/train_tasks.jsonl"
rows = 8

[evaluation]
id = "miniwob-qwen3vl8b-rft-v6-heldout"
path = "evaluator/miniwob/heldout_tasks.jsonl"
rows = 24
num_runs = 2
max_concurrent_rollouts = 2

[model]
base_model = "accounts/fireworks/models/qwen3-vl-8b-instruct"
output_model = "miniwob-qwen3vl8b-rft-v6"

[rollout]
response_candidates_count = 8
max_concurrent_rollouts = 1
max_concurrent_evaluations = 1
chunk_size = 8

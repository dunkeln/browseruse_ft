steps = 20
temperature = 0.8

[training]
epochs = 2
lora_rank = 16
max_context_length = 16384
loss_method = "platform-default"

[wandb]
enabled = true
entity = "dunkeln"
project = "browseruse-ft"
api_key_env = "WANDB_API_KEY"

[monitor]
interval_seconds = 15
no_progress_seconds = 600

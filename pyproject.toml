[project]
name = "browseruse-ft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.2.2",
    "click>=8.3.1",
    "datasets>=5.0.1",
    "duckdb>=1.5.5",
    "fireworks-ai>=1.2.6",
    "marimo[mcp]>=0.23.16",
    "playwright>=1.62.0",
    "polars>=1.43.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlglot>=30.15.0",
]

[project.scripts]
browseruse-data = "browseruse_ft.cli:download_data"
browseruse-sft = "browseruse_ft.cli:prepare_sft"
browseruse-train = "browseruse_ft.cli:train_sft"
browseruse-world = "browseruse_ft.cli:world_smoke"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
